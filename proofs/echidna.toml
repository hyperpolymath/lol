#
# Echidna Configuration for 1000Langs
# ====================================

[project]
name = "1000langs-proofs"
version = "0.1.0"
description = "Formal verification for 1000Langs corpus crawler"

[provers]
# Primary provers to use
primary = ["agda", "coq"]
# Fallback provers for unsupported features
fallback = ["lean", "z3"]

[provers.agda]
# Matches the apt-pinned toolchain used by .github/workflows/echidna-verify.yml
# (ubuntu-latest: Agda 2.6.4.3 + stdlib 1.7.2). Bump deliberately, in lockstep
# with the workflow if the runner image moves.
version = "2.6.4"
stdlib = true
# `--safe` applies to every module EXCEPT the quarantined trust base
# (theories/InformationTheory/Axioms.agda, which holds the ECHIDNA:trust
# postulates and is checked with --without-K only). The split is enforced by
# scripts/audit-trust-base.py; see proofs/README.adoc.
flags = ["--safe", "--without-K"]

[provers.coq]
version = "8.18"
flags = ["-q"]

[provers.lean]
version = "4.0"
mathlib = true

[provers.z3]
version = "4.12"
timeout = 30

[verification]
# Verification level: "full", "quick", "smoke"
level = "full"
# Parallel verification
parallel = true
# Maximum workers
workers = 4
# Cache verified results
cache = true
cache_dir = ".echidna-cache"

[specifications]
# Specification sketches — design inputs, NOT yet machine-checked
# (they use Agda-like pseudo-syntax, e.g. a `theorem` keyword Agda lacks).
files = [
  "specs/alignment.spec",
  "specs/statistics.spec",
  "specs/iso639.spec",
]

[theories]
# Background theories to load (files that exist; see proofs/README.adoc for
# the Foundations/Axioms quarantine layout and the trust-base manifest)
files = [
  "theories/InformationTheory.agda",
  "theories/InformationTheory/Foundations.agda",
  "theories/InformationTheory/Axioms.agda",
]

[output]
# Output format for verification results
format = "json"
# Output file
file = "verification-results.json"
# Generate HTML report
html_report = true
html_dir = "reports/"

[aspects]
# Aspect tags for proof categorization
enabled = true
tags = [
  "data-integrity",
  "alignment",
  "statistics",
  "type-safety",
  "opencyc",
]

[opencyc]
# OpenCyc integration for common-sense reasoning
enabled = true
endpoint = "http://localhost:3602"
concepts = [
  "#$HumanLanguage",
  "#$WritingScript",
  "#$GeographicalRegion",
  "#$LinguisticProperty",
]

[ci]
# CI/CD integration. fail_on_unverified must stay true — the standards-era
# gate fail-opened precisely because unverified was tolerated (issue #4).
fail_on_unverified = true
min_coverage = 0.8
report_format = "junit"
