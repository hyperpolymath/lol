# Prevention workflow - runs OpenSSF Scorecard and fails on low scores
name: OpenSSF Scorecard Enforcer

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scorecard:
    permissions:
      actions: read
      contents: read
      id-token: write
      security-events: write
    uses: metadatastician/standards/.github/workflows/scorecard-reusable.yml@1ded685afb366dededa9f372f82fb58cd45f3c7b
